<!DOCTYPE html>
<html lang="en" data-theme="dark" data-accent="cobalt" data-signal="muted">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>AI Business Intelligence</title>
<script>
/* Theme before first paint: the saved choice, else the computer's setting. Without
   this every page load painted dark and then switched, for everyone in light mode. */
(function(){var d=document.documentElement,t=null;try{t=localStorage.getItem('icc-theme')}catch(e){}
if(t!=='light'&&t!=='dark')t=window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';
d.setAttribute('data-theme',t)})();
</script>
<link rel="icon" href="/assets/command_center/images/command-center.svg">
{% if assets.css %}<link rel="stylesheet" href="{{ assets.css }}">{% endif %}
</head>
<body>
<div id="cc-root"></div>
<script>
/* Everything the interface needs on first paint, delivered inline so the
   greeting and the business scope are right immediately rather than flashing a
   placeholder. */
window.CC_BOOT = {{ boot | safe }};
window.csrf_token = {{ csrf_token | safe }};
</script>
<script type="module" src="{{ assets.js }}"></script>
</body>
</html>
