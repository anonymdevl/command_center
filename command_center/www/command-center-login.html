<!DOCTYPE html>
{% import "_signin.html" as sg %}
<html lang="en" data-theme="light" data-accent="cobalt">
<head>
{{ sg.head(brand, assets, "Sign in") }}
</head>
<body class="cc-auth cc-signin">
{{ sg.top(brand) }}

<main class="sg-stage">
  <section class="sg-card">
    <h1>Sign In</h1>
    <p class="auth-sub">Use the email and password you were given.</p>

    <form id="auth" novalidate>
      <label for="usr">Email or Username</label>
      <input id="usr" name="usr" type="text" autocomplete="username" autocapitalize="off"
             spellcheck="false" required autofocus>

      <label for="pwd">Password</label>
      <div class="auth-pw">
        <input id="pwd" name="pwd" type="password" autocomplete="current-password" required>
        <button type="button" id="show" aria-label="Show password" aria-pressed="false">Show</button>
      </div>

      <div id="msg" class="auth-msg" role="alert" aria-live="polite"></div>

      <button type="submit" id="go" class="auth-go">Sign In</button>
    </form>

    <div class="auth-foot">
      <span class="auth-forgot"><b>Forgotten your password?</b><span>Ask your administrator.</span></span>
      <span class="auth-only">Management Team Only</span>
    </div>
  </section>
</main>

{{ sg.foot(brand) }}

{{ sg.scripts() }}
<script>
window.csrf_token = {{ csrf_token | safe }};
(function () {
  var form = document.getElementById("auth"), msg = document.getElementById("msg"),
      go = document.getElementById("go"), pwd = document.getElementById("pwd"),
      show = document.getElementById("show");
  var HOME = "/command-center";

  show.onclick = function () {
    var on = pwd.type === "password";
    pwd.type = on ? "text" : "password";
    show.textContent = on ? "Hide" : "Show";
    show.setAttribute("aria-pressed", on ? "true" : "false");
    show.setAttribute("aria-label", on ? "Hide password" : "Show password");
  };

  function say(text) { msg.textContent = text || ""; msg.classList.toggle("on", !!text); }

  form.onsubmit = function (e) {
    e.preventDefault();
    var usr = document.getElementById("usr").value.trim(), pw = pwd.value;
    if (!usr || !pw) { say("Enter your email or username and your password."); return; }
    say("");
    go.disabled = true;
    go.textContent = "Signing In…";
    fetch("/api/method/login", {
      method: "POST",
      credentials: "same-origin",
      headers: { "Content-Type": "application/json", "Accept": "application/json",
                 "X-Frappe-CSRF-Token": window.csrf_token || "" },
      body: JSON.stringify({ usr: usr, pwd: pw })
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (b) { return { r: r, b: b }; });
    }).then(function (x) {
      var b = x.b || {};
      // Two-factor: ERPNext's own login runs the code step, then returns here.
      if (b.verification || b.tmp_id || (b.message && b.message.verification)) {
        window.location.href = "/login?redirect-to=" + encodeURIComponent(HOME);
        return;
      }
      if (x.r.ok) { window.location.href = HOME; return; }
      var text = x.r.status === 401 ? "That email or password is not right."
        : (b.message && typeof b.message === "string" ? b.message : "") ||
          (b._server_messages ? "ERPNext refused the sign-in. Try again in a moment." :
           "Could not sign in. Try again in a moment.");
      say(text);
      go.disabled = false;
      go.textContent = "Sign In";
      pwd.select();
    }).catch(function () {
      say("The server could not be reached. Check your connection and try again.");
      go.disabled = false;
      go.textContent = "Sign In";
    });
  };
})();
</script>
</body>
</html>
