<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"
     role="img" aria-label="Intelligent Command Center">
  <defs>
    <linearGradient id="ccBg" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#1b222e"/>
      <stop offset="1" stop-color="#0b0e13"/>
    </linearGradient>
    <linearGradient id="ccBar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#9a7429"/>
      <stop offset="1" stop-color="#e0ad44"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="15" fill="url(#ccBg)"/>
  <rect x=".75" y=".75" width="62.5" height="62.5" rx="14.25"
        fill="none" stroke="#ffffff" stroke-opacity=".07"/>

  <!-- the business, as its own numbers -->
  <g fill="url(#ccBar)">
    <rect x="17" y="36" width="6.5" height="11" rx="3.25" opacity=".55"/>
    <rect x="28.75" y="30" width="6.5" height="17" rx="3.25" opacity=".8"/>
    <rect x="40.5" y="24" width="6.5" height="23" rx="3.25"/>
  </g>

  <!-- the layer that watches over it -->
  <path d="M14 26.5Q32 11.5 50 26.5" fill="none" stroke="#e0ad44"
        stroke-width="2.6" stroke-linecap="round"/>
  <circle cx="50" cy="26.5" r="3.4" fill="#e0ad44"/>
  <circle cx="50" cy="26.5" r="6.4" fill="none" stroke="#e0ad44" stroke-opacity=".28"/>
</svg>
