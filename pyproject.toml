[project]
name = "command_center"
authors = [{ name = "Michael Appiah-Kubi", email = "kubiappiahmichael@gmail.com" }]
description = "Intelligent Command Center — an executive intelligence layer over ERPNext."
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]

# Deliberately minimal. `requests` ships with Frappe and is declared here only so
# the dependency is visible; it is left unpinned so pip resolves to whatever
# version the bench already has rather than pulling a second copy. `anthropic` is
# Claude's official SDK (the analyst, from 14 Nov 2026); 0.125 is the first with
# server-side refusal fallbacks, and later majors keep the calls ask/claude.py makes.
dependencies = [
    "requests",
    "anthropic>=0.125",
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.flit.module]
name = "command_center"

# The platform's own site runs Frappe v16. ERPNext is not needed there: on the hosted
# service every business is reached over its API, whatever version it runs (Gigmann's
# is v14 as of 14 Nov 2026).
[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"
